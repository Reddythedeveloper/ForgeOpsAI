name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio
      - name: Lint
        run: ruff check backend mcp_server workflows || echo "Ruff failed, but continuing for now"
      - name: Type check
        run: mypy backend/app mcp_server workflows --ignore-missing-imports || echo "Mypy failed, but continuing for now"
      - name: Test
        run: |
          # pytest -q
          echo "Placeholder for pytest"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint || echo "Lint warnings"
      - name: Build
        run: cd frontend && npm run build
